<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0  285">
  <style>
    @media (prefers-color-scheme: dark) {
      .stat, .lang-name, .not_bold, .bold { fill: #ffffff !important; }
      .header { fill: #40c9d2 !important; }
      .icon { fill: #c5a3ff !important; }
      .rank-text { fill: #ffffff !important; }
      .rank-circle-rim { stroke: #40c9d2 !important; }
      .rank-circle { stroke: #40c9d2 !important; }
    }
  </style>
  <svg x="0" y="0" width="576.5" height="120">
    <style>
    .text { font: 600 16px 'Segoe UI', Ubuntu, Sans-Serif; fill: #137980 }
    .small { font: 600 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #4c4f69 }
    .gray { fill: #858585 }
    </style>
    <rect x="0.5" y="0.5" width="575.5" height="99%" rx="4.5" fill="#00000000" stroke="#e4e2e2"/>
    <text x="25" y="45" class="text">Something went wrong! file an issue at https://tiny.one/readme-stats</text>
    <text data-testid="message" x="25" y="55" class="text small">
      <tspan x="25" dy="18">Resource not accessible by integration</tspan>
      <tspan x="25" dy="18" class="gray">OK</tspan>
    </text>
    </svg>
  </svg>
  <svg x="" y="0" width="300" height="285">
      <svg
        width="300"
        height="285"
        viewBox="0 0 300 285"
        fill="none"
        role="img"
        aria-labelledby="descId"
      >
        <title id="titleId"></title>
        <desc id="descId"></desc>
        <style>
          .header {
            font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif;
            fill: #137980;
            animation: fadeInAnimation 0.8s ease-in-out forwards;
          }
          @supports(-moz-appearance: auto) {
            /* Selector detects Firefox */
            .header { font-size: 15.5px; }
          }
          
    @keyframes slideInAnimation {
      from {
        width: 0;
      }
      to {
        width: calc(100%-100px);
      }
    }
    @keyframes growWidthAnimation {
      from {
        width: 0;
      }
      to {
        width: 100%;
      }
    }
    .stat {
      font: 600 14px 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif; fill: #4c4f69;
    }
    @supports(-moz-appearance: auto) {
      /* Selector detects Firefox */
      .stat { font-size:12px; }
    }
    .bold { font-weight: 700 }
    .lang-name {
      font: 400 11px "Segoe UI", Ubuntu, Sans-Serif;
      fill: #4c4f69;
    }
    .stagger {
      opacity: 0;
      animation: fadeInAnimation 0.3s ease-in-out forwards;
    }
    #rect-mask rect{
      animation: slideInAnimation 1s ease-in-out forwards;
    }
    .lang-progress{
      animation: growWidthAnimation 0.6s ease-in-out forwards;
    }
    

          
      /* Animations */
      @keyframes scaleInAnimation {
        from {
          transform: translate(-5px, 5px) scale(0);
        }
        to {
          transform: translate(-5px, 5px) scale(1);
        }
      }
      @keyframes fadeInAnimation {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
    
          
        </style>

        

        <rect
          data-testid="card-bg"
          x="0.5"
          y="0.5"
          rx="0"
          height="99%"
          stroke="#e4e2e2"
          width="299"
          fill="#00000000"
          stroke-opacity="0"
        />

        
      <g
        data-testid="card-title"
        transform="translate(25, 35)"
      >
        <g transform="translate(0, 0)">
      <text
        x="0"
        y="0"
        class="header"
        data-testid="header"
      >Most Used Languages</text>
    </g>
      </g>
    

        <g
          data-testid="main-card-body"
          transform="translate(0, 55)"
        >
          
    <svg data-testid="lang-items" x="25">
      <g transform="translate(0, 0)">
    <g class="stagger" style="animation-delay: 450ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">TypeScript</text>
      <text x="215" y="34" class="lang-name">54.94%</text>
      
    <svg width="205" x="0" y="25">
      <rect data-testid="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" fill="#ddd"></rect>
      <svg data-testid="lang-progress" width="54.942919590951455%">
        <rect
            height="8"
            fill="#3178c6"
            rx="5" ry="5" x="0" y="0"
            class="lang-progress"
            style="animation-delay: 750ms;"
        />
      </svg>
    </svg>
  
    </g>
  </g><g transform="translate(0, 40)">
    <g class="stagger" style="animation-delay: 600ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">Kotlin</text>
      <text x="215" y="34" class="lang-name">14.32%</text>
      
    <svg width="205" x="0" y="25">
      <rect data-testid="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" fill="#ddd"></rect>
      <svg data-testid="lang-progress" width="14.3227784851935%">
        <rect
            height="8"
            fill="#A97BFF"
            rx="5" ry="5" x="0" y="0"
            class="lang-progress"
            style="animation-delay: 900ms;"
        />
      </svg>
    </svg>
  
    </g>
  </g><g transform="translate(0, 80)">
    <g class="stagger" style="animation-delay: 750ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">Rust</text>
      <text x="215" y="34" class="lang-name">14.10%</text>
      
    <svg width="205" x="0" y="25">
      <rect data-testid="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" fill="#ddd"></rect>
      <svg data-testid="lang-progress" width="14.101544956287434%">
        <rect
            height="8"
            fill="#dea584"
            rx="5" ry="5" x="0" y="0"
            class="lang-progress"
            style="animation-delay: 1050ms;"
        />
      </svg>
    </svg>
  
    </g>
  </g><g transform="translate(0, 120)">
    <g class="stagger" style="animation-delay: 900ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">Vue</text>
      <text x="215" y="34" class="lang-name">8.76%</text>
      
    <svg width="205" x="0" y="25">
      <rect data-testid="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" fill="#ddd"></rect>
      <svg data-testid="lang-progress" width="8.755398404272777%">
        <rect
            height="8"
            fill="#41b883"
            rx="5" ry="5" x="0" y="0"
            class="lang-progress"
            style="animation-delay: 1200ms;"
        />
      </svg>
    </svg>
  
    </g>
  </g><g transform="translate(0, 160)">
    <g class="stagger" style="animation-delay: 1050ms">
      <text data-testid="lang-name" x="2" y="15" class="lang-name">CSS</text>
      <text x="215" y="34" class="lang-name">7.88%</text>
      
    <svg width="205" x="0" y="25">
      <rect data-testid="progress-background" rx="5" ry="5" x="0" y="0" width="205" height="8" fill="#ddd"></rect>
      <svg data-testid="lang-progress" width="7.877358563294838%">
        <rect
            height="8"
            fill="#663399"
            rx="5" ry="5" x="0" y="0"
            class="lang-progress"
            style="animation-delay: 1350ms;"
        />
      </svg>
    </svg>
  
    </g>
  </g>
    </svg>
  
        </g>
      </svg>
    </svg>
</svg>
